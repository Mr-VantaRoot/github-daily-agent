name: Daily Repository Scan

on:
  schedule:
    # 22:19 Ethiopia time (UTC+3)
    - cron: "19 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-daily-agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out agent
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run automated tests
        id: tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run daily scan
        id: scan
        env:
          GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
        run: |
          PYTHONPATH=src python -m github_daily_agent --config config.yaml

      - name: Record daily run
        if: always() && steps.checkout.outcome == 'success'
        env:
          TEST_RESULT: ${{ steps.tests.outcome || 'not-run' }}
          SCAN_RESULT: ${{ steps.scan.outcome || 'not-run' }}
          CONTRIBUTION_EMAIL: "268955758+Mr-VantaRoot@users.noreply.github.com"
        run: |
          set -euo pipefail
          today="$(TZ=Africa/Addis_Ababa date +'%Y-%m-%d')"
          mkdir -p activity
          file="activity/${today}.md"

          if [ -e "$file" ]; then
            echo "Daily record already exists for ${today}; no duplicate commit."
            exit 0
          fi

          cat > "$file" <<EOF
          # Daily GitHub Agent Run

          - Date: ${today} (Africa/Addis_Ababa)
          - Automated tests: ${TEST_RESULT}
          - Repository scan: ${SCAN_RESULT}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git config user.name "Mr-VantaRoot"
          git config user.email "$CONTRIBUTION_EMAIL"
          git add "$file"
          git commit -m "chore: record daily agent run (${today})"
          git push origin HEAD:main

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-agent-report
          path: reports/latest.md
          if-no-files-found: warn
          retention-days: 30
