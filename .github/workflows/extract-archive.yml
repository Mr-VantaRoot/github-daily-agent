name: Extract project archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          test -f github-daily-agent.zip
          mkdir -p /tmp/agent-archive
          unzip -o github-daily-agent.zip -d /tmp/agent-archive
          test -d /tmp/agent-archive/github-daily-agent
          cp -a /tmp/agent-archive/github-daily-agent/. .
          rm github-daily-agent.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract GitHub Daily Agent project files"
            git push
          fi
