name: Daily Repository Scan

on:
  schedule:
    # 22:00 Ethiopia time (UTC+3), leaving time for a same-day contribution check.
    - cron: "19 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-daily-agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out agent
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run automated tests
        id: tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run daily scan
        id: scan
        env:
          GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
        run: |
          PYTHONPATH=src python -m github_daily_agent --config config.yaml

      - name: Check today's GitHub contributions
        id: contribution_check
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
        run: |
          set -euo pipefail

          today="$(TZ= Africa/Addis_Ababa date +'%Y-%m-%d')"
          from="$(TZ=Africa/Addis_Ababa date -d "$today 00:00:00" --iso-8601=seconds)"
          to="$(TZ=Africa/Addis_Ababa date --iso-8601=seconds)"

          query='query($from: DateTime!, $to: DateTime!) {
            viewer {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }'

          response="$(gh api graphql -f query="$query" -F from="$from" -F to="$to")"
          count="$(jq -r --arg today "$today" '
            [.data.viewer.contributionsCollection.contributionCalendar.weeks[].contributionDays[]
             | select(.date == $today)
             | .contributionCount] | first // 0
          ' <<< "$response")"

          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "GitHub already reports $count contribution(s) for $today. No streak commit needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No contribution is currently recorded for $today."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record contribution if today's graph is empty
        if: steps.contribution_check.outputs.needed == 'true'
        env:
          TODAY: ${{ steps.contribution_check.outputs.today }}
          TEST_RESULT: ${{ steps.tests.outcome || 'not-run' }}
          SCAN_RESULT: ${{ steps.scan.outcome || 'not-run' }}
          CONTRIBUTION_EMAIL: "268955758+Mr-VantaRoot@users.noreply.github.com"
        run: |
          set -euo pipefail
          mkdir -p activity
          file="activity/${TODAY}.md"

          if [ -e "$file" ]; then
            echo "A contribution record already exists for ${TODAY}; skipping a duplicate commit."
            exit 0
          fi

          cat > "$file" <<EOF
          # Daily GitHub Agent Run

          - Date: ${TODAY} (Africa/Addis_Ababa)
          - Automated tests: ${TEST_RESULT}
          - Repository scan: ${SCAN_RESULT}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          git config user.name "Mr-VantaRoot"
          git config user.email "$CONTRIBUTION_EMAIL"
          git add "$file"
          git commit -m "chore: record daily activity (${TODAY})"
          git push origin HEAD:main

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-agent-report
          path: reports/latest.md
          if-no-files-found: warn
          retention-days: 30
